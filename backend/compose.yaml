name: vehicle-backend
services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: vehicle
      POSTGRES_PASSWORD: vehicle
      POSTGRES_DB: vehicle
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle -d vehicle"]
      interval: 2s
      timeout: 2s
      retries: 30
  temporal:
    user: "0:0"
    image: temporalio/temporal@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: ["temporal-data:/data"]
  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://vehicle:vehicle@postgres:5432/vehicle
      TEMPORAL_ADDRESS: temporal:7233
      STORAGE_PATH: /data/objects
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["objects:/data/objects", "../contracts:/srv/contracts:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_started}
  worker:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "app.worker"]
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg://vehicle:vehicle@postgres:5432/vehicle
      TEMPORAL_ADDRESS: temporal:7233
      STORAGE_PATH: /data/objects
    volumes: ["objects:/data/objects", "../contracts:/srv/contracts:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_started}
volumes:
  postgres-data:
  temporal-data:
  objects:
