[project]
name = "vehicle-requirements-backend"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
  "fastapi==0.143.0", "pydantic==2.14.0", "pydantic-settings>=2,<3",
  "uvicorn==0.54.0", "python-multipart==0.0.32",
  "sqlalchemy==2.1.4", "psycopg[binary]==3.3.6", "alembic==1.20.0",
  "temporalio==1.34.0", "openpyxl==3.1.5", "pypdf==6.20.0",
  "boto3==1.43.111", "openai==3.28.0", "httpx==0.28.1",
  "pyjwt[crypto]==2.15.1", "cryptography==50.0.2",
  "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[project.optional-dependencies]
pdf = ["docling==2.137.0", "torch==2.14.1", "torchvision==0.29.1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0", "mypy==2.4.0", "jsonschema>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true

